# Restore the Oracle JDK 7u80 (the Jetty 9.2.x release toolchain) security defaults.
# Zulu 7u352 backports later CPU tightenings (MD5withRSA certs disabled, TLSv1/TLSv1.1
# disabled), which reject the 2000-era MD5withRSA test certificate in
# jetty-server/src/test/resources/keystore and the SSLv3-context client in SSLCloseTest.
jdk.certpath.disabledAlgorithms=MD2, RSA keySize < 1024
jdk.tls.disabledAlgorithms=SSLv3
